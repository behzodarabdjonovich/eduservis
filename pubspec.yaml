name: edu_servis
description: EDU SERVIS Xalqaro Ilmiy Platformasi (Admin Panel - Go Backend)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Web marshrutlash uchun kerak
  flutter_web_plugins:
    sdk: flutter

  # Asosiy arxitektura va holatni boshqarish
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.4
  go_router: ^14.2.0

  # Tarmoq va Lokal Xotira
  dio: ^5.5.0
  shared_preferences: ^2.2.3

  # UI / UX komponentlar
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.2

  # Fayllar bilan ishlash
  file_picker: ^8.0.0
  flutter_image_compress: ^2.3.0

  # Yordamchi paketlar
  intl: ^0.19.0
  translator: ^1.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#1E3A8A"